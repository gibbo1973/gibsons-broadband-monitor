name: Docker Hub mirror
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Existing verified GHCR release tag to mirror
        required: true
        default: v0.4.1
permissions:
  contents: read
concurrency:
  group: dockerhub-publish
  cancel-in-progress: false
jobs:
  mirror:
    if: vars.DOCKERHUB_USERNAME != '' && (github.event_name == 'workflow_dispatch' || !github.event.release.prerelease)
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.event.release.tag_name }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
    steps:
      - name: Validate release tag and namespace
        shell: bash
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'A stable vX.Y.Z tag is required'; exit 1; }
          [[ "$DOCKERHUB_USERNAME" =~ ^[a-z0-9][a-z0-9_-]+$ ]] || { echo 'Invalid Docker Hub namespace'; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Mirror the tested multi-platform image without rebuilding
        shell: bash
        run: |
          destination="$DOCKERHUB_USERNAME/gibsons-broadband-monitor"
          docker buildx imagetools create \
            --tag "$destination:$VERSION" \
            --tag "$destination:${VERSION#v}" \
            --tag "$destination:latest" \
            "ghcr.io/${{ github.repository }}:$VERSION"
          docker buildx imagetools inspect "$destination:$VERSION"
