name: Platform packages
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt PyYAML jsonschema
      - name: Validate metadata and exercise both installation packages
        run: python scripts/check-platform-packages.py --docker
      - name: Validate CasaOS Compose
        run: docker compose -f casaos/Apps/GibsonsBroadbandMonitor/docker-compose.yml config -q
        env:
          AppID: gibsons-broadband-monitor
      - name: Validate Runtipi Compose
        run: docker compose -f apps/gibsons-broadband-monitor/docker-compose.yml config -q
        env:
          APP_DATA_DIR: /tmp/gbm-validation
          TZ: UTC
          GBM_DASHBOARD_PASSWORD: validation-only-password
          GBM_SECRET_KEY: validation-only-session-secret
