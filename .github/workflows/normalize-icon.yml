name: Correct icon proportions
on:
  push:
    paths:
      - '.github/workflows/normalize-icon.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image utility
        run: python -m pip install 'Pillow>=10,<12'
      - name: Re-export square artwork without stretching
        run: python scripts/normalize-icons.py
      - name: Commit corrected icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app-icon.png assets/app-icon-192.png app/static/icon.png
          if ! git diff --cached --quiet; then
            git commit -m "Fix distorted Unraid icon aspect ratio"
            git push
          fi
