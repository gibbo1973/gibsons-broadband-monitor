services:
  gibsons-broadband-monitor:
    image: ghcr.io/gibbo1973/gibsons-broadband-monitor:v0.4.1
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      DASHBOARD_PASSWORD: ${GBM_DASHBOARD_PASSWORD}
      SECRET_KEY: ${GBM_SECRET_KEY}
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - type: bind
        source: /proc/1/net
        target: /host/proc/net
        read_only: true
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    x-runtipi:
      is_main: true
      internal_port: 8765
x-runtipi:
  schema_version: 2
