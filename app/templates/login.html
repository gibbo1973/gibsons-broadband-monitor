<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#07131f"><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"><title>Sign in · Gibson's Broadband Monitor</title></head><body class="login-page"><form class="login-card" method="post"><img src="{{ url_for('static',filename='icon.svg') }}" alt="Gibson's logo" width="76" height="76"><h1>Gibson's Broadband Monitor</h1><p>Enter the dashboard password to continue.</p><div class="login-language"><label for="language-select">Language</label><select id="language-select" aria-label="Language"></select></div><input type="password" name="password" placeholder="Dashboard password" autocomplete="current-password" autofocus required><button class="action-btn" type="submit">Open dashboard</button>{% if message %}<p class="error">{{ message }}</p>{% endif %}</form><script src="{{ url_for('static',filename='i18n.js') }}" defer></script></body></html>
